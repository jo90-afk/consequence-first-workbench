name: Distribution assurance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality - validator regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s tests -v

  assurance:
    name: Assurance - distribution contract
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Validate exact distribution and activation case contract
        run: python3 scripts/validate_distribution.py
      - name: Verify host evaluation plan can be prepared
        run: python3 scripts/evaluate_activation.py plan > /dev/null
